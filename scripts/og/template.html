<!doctype html>

<html lang="pt-BR">
<head>

<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=Hanken+Grotesk:wght@400;500&display=block" rel="stylesheet" />
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #0e0c0a; color: #f3e9d7; font-family: "Hanken Grotesk", sans-serif; position: relative; }
  .bg { position: absolute; inset: 0; background: url(../../public/images/flour-1600.webp) center/cover; opacity: .38; }

  .heat { position: absolute; width: 780px; height: 780px; right: -160px; top: -75px; border-radius: 50%; background: radial-gradient(circle, rgba(179,38,30,.4) 0%, rgba(142,27,27,.15) 40%, transparent 68%); }
  .pizza { position: absolute; width: 620px; height: 620px; right: -90px; top: 5px; transform: rotate(-14deg); filter: drop-shadow(0 30px 40px rgba(0,0,0,.7)); }
  .txt { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; width: 620px; }
  .logo { display: flex; align-items: center; gap: 14px; font-family: "Bodoni Moda", serif; font-size: 34px; font-weight: 500; }
  .logo svg { width: 46px; height: 46px; color: #b8913f; }
  h1 { font-family: "Bodoni Moda", serif; font-weight: 500; font-size: 104px; line-height: .92; letter-spacing: -.02em; margin-top: 54px; }
  p { margin-top: 30px; font-size: 25px; line-height: 1.45; color: rgba(243,233,215,.78); max-width: 520px; }
  .rule { position: absolute; left: 72px; right: 72px; bottom: 44px; height: 1px; background: linear-gradient(90deg, rgba(184,145,63,.7), transparent 70%); }
</style>
</head>

  <div class="bg"></div><div class="vig"></div><div class="heat"></div>
  <img class="pizza" src="../../public/images/hero-pizza-960.webp" alt="" />
  <div class="txt">
    <div class="logo">
